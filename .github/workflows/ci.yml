name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # waveguide-generator's server job hung on Windows until it got one of
    # these. This suite is ~40s; 25 minutes is a hang detector, not a budget.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # tests/test_wg_mesh_sizing.py reads
      #   <repo>/../hornlab-waveguide-mesher/hornlab_mesher/mesh_sizing.py
      # by path, at module import. On a bare runner that is a collection error
      # that aborts the whole run rather than a skip, so the two repositories
      # have to be laid out as siblings. actions/checkout refuses a path
      # outside GITHUB_WORKSPACE, so both go under it.
      - uses: actions/checkout@v4
        with:
          path: hornlab-fusion-addin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Take the mesher revision from requirements.txt rather than naming it
      # here. The sibling checkout and the installed package must be the same
      # revision: a suite that reads mesh_sizing.py from one revision and
      # imports hornlab_mesher from another is measuring a combination the
      # product never ships. Hard-coding it here would drift the first time
      # the pin moved.
      - name: Resolve the declared hornlab-waveguide-mesher pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sed -nE 's#.*hornlab-waveguide-mesher\.git@([0-9a-f]{40}).*#\1#p' \
                hornlab-fusion-addin/requirements.txt)
          test -n "$sha"
          echo "Declared mesher pin: $sha"
          echo "mesher=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: m3gnus/hornlab-waveguide-mesher
          ref: ${{ steps.pin.outputs.mesher }}
          path: hornlab-waveguide-mesher

      # gmsh ships a wheel but links against the system GL/GLU stack, which the
      # Linux runners do not carry by default. hornlab_mesher.step_import
      # imports gmsh, so without this the import fails.
      - name: Install the system libraries gmsh links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install
        working-directory: hornlab-fusion-addin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Assert the revision that actually resolved, not the one we intended.
      # A .pth in the developer venv here shadowed the pinned package with a
      # local checkout 16 commits behind, and two sessions reported the wrong
      # red/green from it before anyone noticed. The check is one line and it
      # is the difference between a gate and a rumour.
      - name: Prove the pinned mesher is the one that imports
        working-directory: hornlab-fusion-addin
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          import hornlab_mesher
          resolved = os.path.realpath(hornlab_mesher.__file__)
          print("hornlab_mesher resolved to:", resolved)
          assert "site-packages" in resolved, (
              "hornlab_mesher resolved outside site-packages -- something is "
              f"shadowing the pinned package.\nsys.path[:5] = {sys.path[:5]}"
          )
          PY

      # -v, not -q: waveguide-generator's Linux job died on SIGPIPE writing
      # progress dots, and the verbose writer does not reproduce it.
      - name: Suite
        working-directory: hornlab-fusion-addin
        run: python -m pytest tests -v
